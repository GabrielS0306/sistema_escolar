<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema Escolar</title>
    <script>
      // Aplica o tema antes da primeira pintura (evita piscar branco no modo escuro).
      // Mesma chave e regra de hooks/useTema.ts.
      (function () {
        try {
          var preferencia = localStorage.getItem('sistema-escolar-tema') || 'sistema';
          var escuro = preferencia === 'escuro' ||
            (preferencia === 'sistema' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (escuro) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
